<div style="margin: 10px 0 20px 0; padding: 1px; background: var(--code-bg);">

    <footer class="entry-footer">
        {{ partial "social_icons.html" (dict "Context" . "align" "center") }}
        
        <div class="home-info-extension" style="margin-top: 10px; margin-bottom: 11px; text-align: center;">
            
            <p style="color: gray; font-size: 0.95rem; margin-bottom: 12px;">
                📢 Subscribe to my technical blog to receive updates on my latest blog posts and projects.
            </p>

            <form action="/subscribe/" method="get" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <input type="email" 
                       name="email" 
                       placeholder="Enter your email..." 
                       required
                       style="padding: 12px 15px; 
                              border-radius: 8px; 
                              border: 1px solid gray; 
                              background: var(--code-bg); 
                              min-width: 250px;
                              outline: none;">
                
                <button type="submit" 
                        style="background-color: var(--primary); 
                               color: var(--theme); 
                               padding: 12px 24px; 
                               border-radius: 8px; 
                               border: none;
                               cursor: pointer;
                               font-weight: 600;
                               transition: opacity 0.2s;">
                    Subscribe
                </button>
            </form>
        </div>
    </footer>
</div>
